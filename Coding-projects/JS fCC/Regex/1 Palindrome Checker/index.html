<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <h1>Is It a Palindrome?</h1>
    <p id="enter">
      Enter to check for <bold>Palindromes</bold>: <br>
      <input id="text-input" />
      <button id="check-btn">Check</button>
    </p>
    <p id="result"></p>
    <div id="definition">
      A <i>palindrome</i> is a word or sentence that's spelled the same way both
      forward and backward, ignoring punctuation, case, and spacing.
    </div>
    <script src="script.js"></script>
  </body>
</html>
