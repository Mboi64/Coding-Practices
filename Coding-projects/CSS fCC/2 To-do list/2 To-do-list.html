<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="2 to-so-style.css" />
</head>

<body>
    <div class="list">
        <h1>My To-Do List</h1>
        <ul class="todo-list">
            <li>
                <input id="explore" name="explore" type="checkbox" />
                <label for="explore">Explore Gaming Keyboards</label>
                    <ul class="sub-item">
                        <li><a href="https://www.google.com/" target="_blank" class="sub-item-link">Store Link</a></li>
                    </ul>
            </li>
            <li>
                <input id="report" name="report" type="checkbox" />
                <label for="report">Finish the Report</label>
                <ul class="sub-item">
                <li><a href="https://www.google.com/" target="_blank" class="sub-item-link">Request Access</a></li>
                </ul>
            </li>
            <li>
                <input id="receipts" name="receipts" type="checkbox" />
                <label for="receipts">View Phone's Warranty</label>
                <ul class="sub-item">
                    <li><a href="https://www.google.com/" target="_blank" class="sub-item-link">View Receipts</a></li>
                </ul>
                
            </li>
            <li>
                <input id="Model-Number" name="Model-Number" type="checkbox" />
                <label for="Model-Number">Check Processor Specs</label>
                <ul class="sub-item">
                    <li><a href="https://www.youtube.com/watch?v=2qBlE2-WL60" target="_blank" class="sub-item-link">View Model Number</a></li>
                </ul>
                
            </li>
        </ul>
    </div>
</body>

</html>
