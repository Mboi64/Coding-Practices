<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build an Event Flyer Page</title>
  <link rel="stylesheet" href="4 event-style.css" />
</head>

<body>
    <header>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/event.jpg" alt="A string of miniture flags hung in front of a building" />
        <h1>Pet Rock Festival</h1>
    </header>
    <hr>
    <main>
        <section class="Festival">
            <h2>Festival Highlights</h2>
                <ul>
                    <li>Pet Rock Obedience Shows</li>
                    <li>Best Dressed Pet Rock Contest</li>
                    <li>Pet Rock Uphill Racing</li>
                </ul>
        </section>
        <section class="Guests">
            <h2>Special Guests</h2>
                <ul>
                    <li>Ryan Gosling</li>
                    <li>Ryan Reynolds</li>
                </ul>
        </section>
        <section class="Food">
            <h2>Food Trucks</h2>
                <ul>
                    <li>Rock 'n' Roll Tacos</li>
                    <li>Granite  Grill</li>
                    <li>Stone Cold Smoothies</li>
                </ul>
        </section>
    </main>
    <hr>
    <footer>
        <address>
            <p>&copy;2025 Pet Rock Festival</p>
        </address>
    </footer>
</body>

</html>
